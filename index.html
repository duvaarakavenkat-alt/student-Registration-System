
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <div class="form-box">
        <h1>Student Registration</h1>
        <p class="subtitle">Create your student account</p>

        <form action="/register" method="POST">

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="Enter phone number" pattern="[0-9]{10}" required>
            </div>

            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" name="dob" required>
            </div>

            <div class="input-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="input-group">
                <label>Department</label>
                <select name="department" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Commerce</option>
                    <option>Mathematics</option>
                    <option>Physics</option>
                    <option>English</option>
                </select>
            </div>

            <div class="input-group">
                <label>Course</label>
                <input type="text" name="course" placeholder="Enter your course" required>
            </div>

            <div class="input-group">
                <label>Address</label>
                <textarea name="address" placeholder="Enter your address" required></textarea>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create password" minlength="8" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Confirm password" minlength="8" required>
            </div>

            <button type="submit">Register Now</button>
        </form>
    </div>
</div>

</body>
</html>
